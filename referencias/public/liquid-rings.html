<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Rings</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","lil-gui":"https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.js"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

const DEFAULTS = {
    speed: 1, liquid: 1, folds: 1, width: 1, twist: 1,
    zoom: 1, exposure: 0.99, softness: 0.123, reflection: 1.18,
    cyan: '#57aeff', violet: '#5789ff', pink: '#b61aff',
    background: '#000000', dpr: 2, paused: false, antiAliasing: true,
    mutualReflections: true, reflectionStrength: 1, reflectionResolution: 256,
    reflectionFPS: 30, reflectionAntiAliasing: true,
    forms: [
        { x: -3.7, y: 3.1, z: 0, rotationX: 0, rotationY: 0,
          rotationZ: -0.09 * 180 / Math.PI,
          radiusX: 4, radiusY: 4.05, width: 0.40, thickness: 0.105, phase: 0.4 },
        { x: -11.06, y: 3.45, z: 0.3, rotationX: 0, rotationY: 0,
          rotationZ: -0.12 * 180 / Math.PI,
          radiusX: 3.08, radiusY: 2.66, width: 0.43, thickness: 0.12, phase: 2.2 },
        { x: 3.93, y: -3.5, z: 0.5, rotationX: 0, rotationY: 0,
          rotationZ: 0.06 * 180 / Math.PI,
          radiusX: 5.15, radiusY: 4.65, width: 0.36, thickness: 0.095, phase: 4.1 }
    ]
};
const params = { ...DEFAULTS, forms: DEFAULTS.forms.map(form => ({ ...form })) };
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(params.background);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
camera.position.set(0, 0, 15);

const uniforms = {
    uReflectionBias: { value: 0 },
    uCapture: { value: false }, uMutualStrength: { value: 0 },
    uTime: { value: 0 }, uLiquid: { value: params.liquid },
    uFolds: { value: params.folds }, uWidth: { value: params.width },
    uTwist: { value: params.twist }, uExposure: { value: params.exposure },
    uSoftness: { value: params.softness }, uReflection: { value: params.reflection },
    uCyan: { value: new THREE.Color(params.cyan) },
    uViolet: { value: new THREE.Color(params.violet) },
    uPink: { value: new THREE.Color(params.pink) }
};

const vertexShader = /* glsl */`
uniform float uTime, uLiquid, uFolds, uWidth, uTwist;
uniform vec4 uShape;
uniform float uPhase;
varying vec3 vNormal;
varying vec3 vPosition;
const float TAU = 6.28318530718;

vec3 surface(vec2 coord) {
    float a = coord.x * TAU;
    float b = coord.y * TAU;
    float t = uTime * TAU / 15.0;
    float s = uPhase;
    float flow = a * 3.0 - t + s;
    float wave = sin(flow + 0.48 * sin(a * 5.0 + t));
    float ripple = sin(a * 7.0 + t + s) * 0.55
                 + sin(a * 11.0 - t * 2.0 - s) * 0.25;
    float radial = uLiquid * (0.10 * wave + 0.055 * ripple);
    vec3 center = vec3((uShape.x + radial) * cos(a),
                       (uShape.y + radial) * sin(a),
                       0.16 * uLiquid * sin(a * 4.0 + t + s));
    vec3 outward = normalize(vec3(cos(a) / uShape.x, sin(a) / uShape.y, 0.0));
    vec3 depth = vec3(0.0, 0.0, 1.0);
    float turn = uTwist * (0.65 * sin(a * 2.0 + s)
               + 0.46 * sin(a * 4.0 - t + s));
    vec3 wideAxis = outward * cos(turn) + depth * sin(turn);
    vec3 thinAxis = -outward * sin(turn) + depth * cos(turn);
    float breathing = 1.0 + uLiquid * (0.26 * wave + 0.13 * ripple);
    float width = uShape.z * uWidth * breathing;
    // Both sides share one midsurface, preventing folds from crossing.
    float lateral = cos(b);
    float fold = uFolds * (0.17 * sin(a * 6.0 + 2.0 * lateral - t + s)
               + 0.065 * sin(a * 13.0 + 1.2 * cos(2.0 * b) + t));
    float edge = sin(b);
    // Positive thickness is identical at matching front and back positions.
    float bulge = 1.0 + 0.19 * sin(a * 9.0 + 2.0 * lateral + t + s) * uLiquid;
    return center + wideAxis * width * lateral
        + thinAxis * (uShape.w * bulge * edge + fold * (0.35 + 0.65 * edge * edge));
}
void main() {
    vec3 p = surface(uv);
    float e = 0.00015;
    vec3 tangent = surface(uv + vec2(e, 0.0)) - surface(uv - vec2(e, 0.0));
    vec3 across = surface(uv + vec2(0.0, e)) - surface(uv - vec2(0.0, e));
    vNormal = normalize(mat3(modelMatrix) * normalize(cross(tangent, across)));
    vec4 world = modelMatrix * vec4(p, 1.0);
    vPosition = world.xyz;
    gl_Position = projectionMatrix * viewMatrix * world;
}`;

const fragmentShader = /* glsl */`
uniform float uExposure, uSoftness, uReflection, uMutualStrength, uReflectionBias;
uniform bool uCapture;
uniform samplerCube uEnvironment;
uniform vec3 uCyan, uViolet, uPink;
varying vec3 vNormal;
varying vec3 vPosition;

float panel(vec2 p, vec2 extent, float blur) {
    vec2 d = abs(p) - extent;
    float distance = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    return 1.0 - smoothstep(-blur, blur, distance);
}
vec3 studio(vec3 r) {
    float azimuth = atan(r.x, r.z);
    float elevation = asin(clamp(r.y, -1.0, 1.0));
    vec2 p = vec2(azimuth, elevation);
    float soft = uSoftness;
    vec3 color = vec3(0.0015, 0.0015, 0.003);
    color += vec3(0.021, 0.019, 0.041) *
        exp(-3.0 * pow(elevation + 0.55, 2.0));
    float bend = 0.12 * sin(azimuth * 1.8);
    vec2 stripe = vec2(azimuth + 0.25, elevation - 0.48 - bend);
    color += uViolet * 0.82 * panel(stripe + vec2(0.0, 0.13), vec2(1.9, 0.18), soft + 0.11);
    color += uPink * 0.90 * panel(stripe + vec2(0.0, 0.025), vec2(1.7, 0.078), soft + 0.042);
    color += vec3(1.65) * panel(stripe, vec2(1.65, 0.040), soft + 0.012);
    color += uCyan * 1.05 * panel(stripe - vec2(0.0, 0.075), vec2(1.8, 0.047), soft + 0.035);
    color += vec3(1.5, 1.55, 1.6) * panel(p - vec2(-1.25, 0.1), vec2(0.15, 0.7), soft + 0.08);
    color += uViolet * 0.75 * panel(p - vec2(1.1, -0.26), vec2(0.32, 0.62), soft + 0.14);
    color += uPink * 0.7 * panel(p - vec2(1.48, -0.16), vec2(0.075, 0.6), soft + 0.045);
    color += uCyan * 0.75 * panel(p - vec2(-2.4, 0.05), vec2(0.065, 1.1), soft + 0.025);
    return color;
}
void main() {
    vec3 n = normalize(vNormal);
    vec3 view = uCapture
        ? normalize(cameraPosition - vPosition)
        : vec3(0.0, 0.0, 1.0);
    if (dot(n, view) < 0.0) n = -n;
    vec3 reflected = reflect(-view, n);
    vec3 color = studio(reflected) * uReflection;
    // Cubemaps contain only the other forms, with transparent empty space.
    if (!uCapture && uMutualStrength > 0.0) {
        vec4 reflectedForms = textureCube(uEnvironment, reflected, uReflectionBias);
        color = color * (1.0 - reflectedForms.a * uMutualStrength)
              + reflectedForms.rgb * uMutualStrength;
    }
    float facing = max(dot(n, view), 0.0);
    color *= 0.78 + 0.22 * pow(1.0 - facing, 5.0);
    // Keep captured radiance linear; apply exposure and tone mapping once.
    if (uCapture) {
        gl_FragColor = vec4(color, 1.0);
        return;
    }
    color *= uExposure;
    color = (color * (2.51 * color + 0.03)) /
            (color * (2.43 * color + 0.59) + 0.14);
    gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
    #include <colorspace_fragment>
}`;

// The shared grid is a closed, flattened tube parameterization.
const geometry = new THREE.PlaneGeometry(1, 1, 384, 64);
const reflectionGeometry = new THREE.PlaneGeometry(1, 1, 160, 48);
const materials = [];
let reflectionsDirty = true;
let lastReflectionTime = -Infinity;
function addArch(settings) {
    const material = new THREE.ShaderMaterial({
        vertexShader, fragmentShader,
        uniforms: {
            ...uniforms,
            uEnvironment: { value: null },
            uShape: { value: new THREE.Vector4() },
            uPhase: { value: settings.phase }
        },
        side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.frustumCulled = false;
    scene.add(mesh);
    materials.push(material);

    function update() {
        reflectionsDirty = true;
        mesh.position.set(settings.x, settings.y, settings.z);
        mesh.rotation.set(
            THREE.MathUtils.degToRad(settings.rotationX),
            THREE.MathUtils.degToRad(settings.rotationY),
            THREE.MathUtils.degToRad(settings.rotationZ)
        );
        material.uniforms.uShape.value.set(
            settings.radiusX, settings.radiusY, settings.width, settings.thickness
        );
    }
    update();
    return { mesh, settings, update };
}
const forms = params.forms.map(addArch);
const reflectionClearColor = new THREE.Color();
const reflectionProbes = [];

function createReflectionProbes() {
    // Capture at double resolution and filter the four subpixels in linear HDR.
    const scale = params.reflectionAntiAliasing ? 2 : 1;
    const captureSize = params.reflectionResolution * scale;
    uniforms.uReflectionBias.value = params.reflectionAntiAliasing ? 1 : 0;
    uniforms.uMutualStrength.value = 0;
    for (const form of forms) form.mesh.material.uniforms.uEnvironment.value = null;
    for (const probe of reflectionProbes) probe.target.dispose();
    reflectionProbes.length = 0;

    for (const form of forms) {
        const target = new THREE.WebGLCubeRenderTarget(captureSize, {
            type: THREE.HalfFloatType,
            format: THREE.RGBAFormat,
            minFilter: params.reflectionAntiAliasing
                ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            generateMipmaps: params.reflectionAntiAliasing,
            depthBuffer: true
        });
        target.texture.colorSpace = THREE.LinearSRGBColorSpace;
        const cubeCamera = new THREE.CubeCamera(0.03, 100, target);
        reflectionProbes.push({ form, target, camera: cubeCamera });
    }
    reflectionsDirty = true;
    lastReflectionTime = -Infinity;
}
createReflectionProbes();

function updateReflections(now) {
    if (!params.mutualReflections || params.reflectionStrength === 0) {
        uniforms.uMutualStrength.value = 0;
        return;
    }
    const moving = !params.paused && params.speed > 0;
    if (!reflectionsDirty && (!moving || now - lastReflectionTime < 1000 / params.reflectionFPS)) return;

    const oldTarget = renderer.getRenderTarget();
    const oldFace = renderer.getActiveCubeFace();
    const oldMip = renderer.getActiveMipmapLevel();
    const oldAlpha = renderer.getClearAlpha();
    renderer.getClearColor(reflectionClearColor);
    renderer.setClearColor(0x000000, 0);
    uniforms.uCapture.value = true;

    // Unbind all reflection maps before rendering into them: no feedback loops.
    for (const form of forms) {
        form.mesh.material.uniforms.uEnvironment.value = null;
        form.mesh.geometry = reflectionGeometry;
    }
    try {
        for (const probe of reflectionProbes) {
            probe.camera.position.copy(probe.form.mesh.position);
            probe.form.mesh.visible = false;
            try {
                probe.camera.update(renderer, scene);
            } finally {
                probe.form.mesh.visible = true;
            }
        }
    } finally {
        uniforms.uCapture.value = false;
        for (const probe of reflectionProbes) {
            probe.form.mesh.geometry = geometry;
            probe.form.mesh.material.uniforms.uEnvironment.value = probe.target.texture;
        }
        renderer.setRenderTarget(oldTarget, oldFace, oldMip);
        renderer.setClearColor(reflectionClearColor, oldAlpha);
    }
    uniforms.uMutualStrength.value = params.reflectionStrength;
    reflectionsDirty = false;
    lastReflectionTime = now;
}

// MSAA handles geometry edges; FXAA smooths the final display-space image.
const sceneTarget = new THREE.WebGLRenderTarget(1, 1, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    samples: Math.min(4, renderer.capabilities.maxSamples)
});
const composer = new EffectComposer(renderer, sceneTarget);
const renderPass = new RenderPass(scene, camera);
const outputPass = new OutputPass();
const fxaaPass = new ShaderPass(FXAAShader);
composer.addPass(renderPass);
composer.addPass(outputPass);
composer.addPass(fxaaPass);
const drawingSize = new THREE.Vector2();

function resize() {
    const width = innerWidth, height = innerHeight;
    const aspect = width / height;
    const viewHeight = 6 / params.zoom;
    camera.left = -viewHeight * aspect / 2;
    camera.right = viewHeight * aspect / 2;
    camera.top = viewHeight / 2;
    camera.bottom = -viewHeight / 2;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(params.dpr);
    renderer.setSize(width, height);
    composer.setPixelRatio(params.dpr);
    composer.setSize(width, height);
    renderer.getDrawingBufferSize(drawingSize);
    fxaaPass.uniforms.resolution.value.set(1 / drawingSize.x, 1 / drawingSize.y);
}
window.addEventListener('resize', resize);
resize();

const gui = new GUI({ title: 'Settings', width: 280 });
const animation = gui.addFolder('Animation');
animation.add(params, 'speed', 0, 2, 0.01).name('Speed');
animation.add(params, 'paused').name('Pause');
const shape = gui.addFolder('Geometry');
function control(folder, key, label, uniform, min, max, step) {
    folder.add(params, key, min, max, step).name(label)
        .onChange(value => uniforms[uniform].value = value);
}
control(shape, 'liquid', 'Liquid Motion', 'uLiquid', 0, 1.8, 0.01);
control(shape, 'folds', 'Folds', 'uFolds', 0, 1.8, 0.01);
control(shape, 'width', 'Width', 'uWidth', 0.4, 1.6, 0.01);
control(shape, 'twist', 'Twist', 'uTwist', 0, 1.8, 0.01);
const formControls = gui.addFolder('Forms');
forms.forEach((form, index) => {
    const folder = formControls.addFolder(`Form ${index + 1}`);
    const position = folder.addFolder('Position');
    const rotation = folder.addFolder('Rotation');
    const geometryControls = folder.addFolder('Geometry');

    for (const axis of ['x', 'y', 'z']) {
        position.add(form.settings, axis, -12, 12, 0.01)
            .name(axis.toUpperCase()).onChange(form.update);
    }
    for (const axis of ['X', 'Y', 'Z']) {
        rotation.add(form.settings, `rotation${axis}`, -180, 180, 0.1)
            .name(`${axis} (deg)`).onChange(form.update);
    }
    for (const [key, label, min, max, step] of [
        ['radiusX', 'Radius X', 0.8, 8, 0.01],
        ['radiusY', 'Radius Y', 0.8, 8, 0.01],
        ['width', 'Width', 0.05, 0.8, 0.005],
        ['thickness', 'Thickness', 0.02, 0.4, 0.001]
    ]) {
        geometryControls.add(form.settings, key, min, max, step)
            .name(label).onChange(form.update);
    }
    folder.add({ reset() {
        Object.assign(form.settings, DEFAULTS.forms[index]);
        form.update();
        folder.controllersRecursive().forEach(controller => controller.updateDisplay());
    } }, 'reset').name('Reset Form');
    folder.close();
});
gui.addFolder('Camera').add(params, 'zoom', 0.7, 1.6, 0.01).name('Zoom').onChange(resize);
const metal = gui.addFolder('Material');
control(metal, 'exposure', 'Exposure', 'uExposure', 0.3, 2.5, 0.01);
control(metal, 'reflection', 'Reflections', 'uReflection', 0.2, 2, 0.01);
control(metal, 'softness', 'Reflection Softness', 'uSoftness', 0.005, 0.15, 0.001);
const reflections = gui.addFolder('Mutual Reflections');
reflections.add(params, 'mutualReflections').name('Enabled');
reflections.add(params, 'reflectionStrength', 0, 1, 0.01).name('Strength');
reflections.add(params, 'reflectionAntiAliasing').name('Anti-aliasing')
    .onChange(createReflectionProbes);
reflections.add(params, 'reflectionResolution', [128, 256, 512]).name('Resolution')
    .onChange(createReflectionProbes);
reflections.add(params, 'reflectionFPS', [15, 30, 60]).name('Update FPS');
const colors = gui.addFolder('Colors');
for (const [key, label, uniform] of [
    ['cyan', 'Cyan', 'uCyan'], ['violet', 'Violet', 'uViolet'], ['pink', 'Pink', 'uPink']
]) colors.addColor(params, key).name(label).onChange(value => uniforms[uniform].value.set(value));
colors.addColor(params, 'background').name('Background').onChange(value => renderer.setClearColor(value));
const performanceControls = gui.addFolder('Performance');
performanceControls.add(params, 'antiAliasing').name('Anti-aliasing');
performanceControls.add(params, 'dpr', [0.5, 0.7, 1, 1.5, 2]).name('DPR').onChange(resize);
gui.onChange(() => { reflectionsDirty = true; });
gui.close();

let lastTime = performance.now();
let visible = true;
const observer = new IntersectionObserver(entries => {
    visible = entries[0].isIntersecting;
    lastTime = performance.now();
});
observer.observe(renderer.domElement);
document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });
renderer.setAnimationLoop(now => {
    const delta = Math.min(Math.max((now - lastTime) / 1000, 0), 0.05);
    lastTime = now;
    if (document.hidden || !visible) return;
    if (!params.paused) uniforms.uTime.value = (uniforms.uTime.value + delta * params.speed) % 15;
    updateReflections(now);
    if (params.antiAliasing) composer.render(delta);
    else renderer.render(scene, camera);
});
window.addEventListener('pagehide', event => {
    if (event.persisted) return;
    renderer.setAnimationLoop(null);
    observer.disconnect();
    geometry.dispose();
    reflectionGeometry.dispose();
    for (const probe of reflectionProbes) probe.target.dispose();
    materials.forEach(material => material.dispose());
    gui.destroy();
    renderPass.dispose();
    outputPass.dispose();
    fxaaPass.dispose();
    composer.dispose();
    renderer.dispose();
});
</script>
</body>
</html>
